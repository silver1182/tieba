<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#10131a">
<title>我的冒险</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ===== 登录 / 注册页 ===== -->
<section id="authView" class="auth-wrap hidden">
  <div class="auth-bg" aria-hidden="true">
    <div class="night-sky">
      <span class="star s1"></span><span class="star s2"></span><span class="star s3"></span>
      <span class="star s4"></span><span class="star s5"></span><span class="star s6"></span>
      <span class="moon"></span>
    </div>
    <div class="campfire-scene">
      <div class="tent"></div>
      <div class="fire">
        <span class="flame f1"></span><span class="flame f2"></span><span class="flame f3"></span>
        <span class="log l1"></span><span class="log l2"></span>
      </div>
      <div class="figure fig1"></div><div class="figure fig2"></div><div class="figure fig3"></div>
      <div class="hills"></div>
    </div>
  </div>
  <div class="auth-card glass" id="authCard"></div>
</section>

<!-- ===== 主界面 ===== -->
<div id="shell" class="shell hidden">
  <aside class="sidebar glass">
    <div class="side-brand">
      <div class="side-logo"><img src="/favicon-32x32.png" alt="我的冒险"></div>
      <div>
        <div class="side-title">我的冒险</div>
        <div class="side-sub">每一次出发，都通往未知</div>
      </div>
    </div>
    <nav class="side-nav" id="sideNav">
      <button data-action="nav" data-view="character" class="active"><span class="nav-ico">⚔️</span>角色</button>
      <button data-action="nav" data-view="backpack"><span class="nav-ico">🎒</span>背包</button>
      <button data-action="nav" data-view="dungeon"><span class="nav-ico">🗺️</span>副本</button>
      <button data-action="nav" data-view="forge"><span class="nav-ico">🔨</span>铁匠铺</button>
      <button data-action="nav" data-view="shop"><span class="nav-ico">🛒</span>商店</button>
      <button data-action="nav" data-view="market"><span class="nav-ico">🏪</span>交易行</button>
    </nav>
    <div class="side-foot">
      <div id="sideAccount"></div>
      <button class="ghost full" id="logoutBtn">退出登录</button>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar glass">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" title="菜单" aria-label="打开菜单">☰</button>
      <div class="brand">
        <span class="brand-mark"><img src="/favicon-32x32.png" alt="我的冒险"></span>
        <div>
          <h1 class="brand-name">我的冒险</h1>
          <p class="brand-sub">每一次出发，都通往未知</p>
        </div>
      </div>
      <div class="top-actions">
        <div class="gold-pill" id="goldPill">🪙 <b>0</b> 金币</div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>

  <div class="side-mask" id="sideMask"></div>
  <aside class="chat-panel glass" id="chatPanel">
    <div class="chat-head">
      <div>
        <h2 class="chat-title">🔥 篝火聊天室</h2>
        <p class="chat-online"><span class="dot"></span><span id="onlineCount">0</span> 人在线</p>
      </div>
      <button class="icon-btn chat-close" id="chatCloseBtn" type="button" title="收起聊天室" aria-label="收起聊天室">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input">
      <div class="emoji-pop hidden" id="emojiPop"></div>
      <button class="icon-btn" id="emojiBtn" title="表情">😊</button>
      <input id="chatInput" type="text" placeholder="聊点什么吧..." maxlength="2000" autocomplete="off">
      <button class="send-btn" id="chatSend" title="发送">➤</button>
    </div>
  </aside>
</div>

<!-- ===== 底部导航（小屏） ===== -->
<nav class="bottom-nav glass" id="bottomNav">
  <button data-action="nav" data-view="character" class="active"><span class="bn-ico">⚔️</span><span>角色</span></button>
  <button data-action="nav" data-view="backpack"><span class="bn-ico">🎒</span><span>背包</span></button>
  <button data-action="nav" data-view="dungeon"><span class="bn-ico">🗺️</span><span>副本</span></button>
  <button data-action="nav" data-view="forge"><span class="bn-ico">🔨</span><span>铁匠铺</span></button>
  <button data-action="nav" data-view="shop"><span class="bn-ico">🛒</span><span>商店</span></button>
  <button data-action="nav" data-view="market"><span class="bn-ico">🏪</span><span>交易行</span></button>
</nav>

<div id="toast"></div>
<div id="modalRoot"></div>
<button class="icon-btn chat-fab" id="chatToggleBtn" type="button" title="打开聊天室" aria-label="打开聊天室">💬</button>
<script src="/app.js"></script>
</body>
</html>
